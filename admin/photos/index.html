<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Website photos · Saltwater Building Co</title>
<meta name="theme-color" content="#0F2226">
<!--
  Private owner page: upload photos for this website. Not in search (noindex), not in the sitemap.
  Signs in to the shared database (Supabase project "Lead-tracker") with the public key only; row level security
  lets only this business's owners change its photos. The public site shows them through /js/site-photos.js.
  Source of this file: danstewart5/Sitewalk-leads site-kit/admin-photos.html (only the SITE block differs per site).
-->
<style>
  :root { --accent: #0F2226; --ink: #1d1d1f; --muted: #66666b; --line: #e3e1dc; --bg: #f7f6f3; --card: #fff; --red: #b42318; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-top: 4px solid var(--accent); border-bottom: 1px solid var(--line); padding: 10px 14px; }
  .bar { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; }
  .bar h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { max-width: 900px; margin: 0 auto; padding: 14px 14px 60px; }
  button, .btn { font: inherit; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 0 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; min-height: 52px; font-size: 17px; }
  button.small, .btn.small { min-height: 38px; padding: 0 10px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .signin { max-width: 420px; margin: 28px auto; }
  .signin h2 { margin: 0 0 6px; font-size: 22px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input { font: inherit; width: 100%; min-height: 50px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: #fff; color: var(--ink); font-size: 17px; }
  input[inputmode="numeric"] { letter-spacing: 6px; font-size: 22px; text-align: center; }
  .row-btns { display: grid; gap: 8px; margin-top: 14px; }
  .link { background: none; border: 0; color: var(--accent); text-decoration: underline; min-height: 40px; padding: 0; }
  .msg { min-height: 1.4em; font-size: 14px; color: var(--muted); margin: 10px 0 0; }
  .msg.err { color: var(--red); }
  .pm { --pm-accent: var(--accent); }
  .who { font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) { .who { display: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title">Website photos</h1>
    <span class="who" id="who"></span>
    <a class="btn small" id="leads" hidden>Leads</a>
    <a class="btn small" href="/" target="_blank" rel="noopener">View site</a>
    <button class="small" id="signout" type="button" hidden>Sign out</button>
  </div>
</header>
<main>
  <p id="loading" class="msg">Loading…</p>

  <section class="card signin" id="v-signin" hidden>
    <h2>Owner sign in</h2>
    <p class="msg" style="margin-top:0">Private page for the business owner: add and arrange the photos on your website.</p>
    <form id="f-email" novalidate>
      <label for="email">Email</label>
      <input id="email" name="username" type="email" autocomplete="username" inputmode="email" required>
      <div id="pw-wrap">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <div class="row-btns">
        <button class="primary" id="b-pw" type="submit">Sign in</button>
        <button class="primary" id="b-code" type="submit" hidden>Email me a sign-in code</button>
        <button class="link" id="b-toggle" type="button">No password? Email me a code instead</button>
      </div>
    </form>
    <form id="f-code" hidden novalidate>
      <label for="code">6-digit code from the email</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" pattern="[0-9]*">
      <div class="row-btns">
        <button class="primary" type="submit">Sign in</button>
        <button class="link" id="b-back" type="button">Use a different email</button>
      </div>
    </form>
    <p class="msg" id="signin-msg" role="status"></p>
  </section>

  <section class="card signin" id="v-none" hidden>
    <h2>Not set up yet</h2>
    <p>You're signed in as <b id="none-email"></b>, but this account can't change the photos on this website yet.</p>
    <p class="msg">Ask your web person to add this email, then sign in again.</p>
  </section>

  <section id="v-photos" hidden></section>
</main>

<script>
  window.PHOTO_DOOR = {
    // ---- the only part that differs per site ----
    site: 'saltwater-builder',
    brand: 'Saltwater Building Co',
    leadsUrl: '',
    // ---- shared database (public values; row level security decides who can change what) ----
    supabaseUrl: 'https://cgrqejsigmzvlhlmvjbx.supabase.co',
    supabaseKey: 'sb_publishable_UkXqc8XM9vH8LLQ9CO_u7g_b1qZ1KxP',
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="photo-manager.js?v=1"></script>
<script>
(function () {
  'use strict';
  var CFG = window.PHOTO_DOOR;
  var $ = function (id) { return document.getElementById(id); };
  var sb = null, user = null, lastUid;
  $('title').textContent = 'Photos · ' + CFG.brand;
  if (CFG.leadsUrl && CFG.leadsUrl.charAt(0) === '/') { $('leads').href = CFG.leadsUrl; $('leads').hidden = false; }

  function show(name) {
    ['loading', 'v-signin', 'v-none', 'v-photos'].forEach(function (v) { $(v).hidden = v !== name; });
    $('signout').hidden = !(name === 'v-none' || name === 'v-photos');
  }
  function say(text, err) { var m = $('signin-msg'); m.textContent = text || ''; m.className = 'msg' + (err ? ' err' : ''); }

  if (!window.supabase || !window.supabase.createClient || !window.PhotoManager) {
    show('v-signin'); say('Couldn’t load the sign-in system. Check your connection and refresh.', true); return;
  }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'photo-door-auth' } });
  sb.auth.onAuthStateChange(function (_e, session) { setTimeout(function () { onSession(session); }, 0); });
  sb.auth.getSession().then(function (r) { onSession(r.data && r.data.session); });

  function onSession(session) {
    var u = session && session.user ? session.user : null;
    var uid = u ? u.id : null;
    if (uid === lastUid) return;
    lastUid = uid; user = u;
    if (location.hash.indexOf('access_token') >= 0 || location.search.indexOf('code=') >= 0) history.replaceState(null, '', location.pathname);
    if (!u) { $('who').textContent = ''; show('v-signin'); return; }
    $('who').textContent = u.email || '';
    show('loading');
    // Join any business this email was invited to, then find this website's business.
    sb.rpc('accept_invites').then(function () { return sb.rpc('my_businesses'); }).then(function (r) {
      if (r.error) throw r.error;
      var mine = r.data || [];
      return sb.from('businesses').select('id,slug,name').eq('slug', CFG.site).maybeSingle().then(function (b) {
        var biz = b.data && mine.some(function (m) { return m.id === b.data.id; }) ? b.data : null;
        if (!biz) { $('none-email').textContent = user.email || ''; show('v-none'); return; }
        show('v-photos');
        window.PhotoManager.mount($('v-photos'), { sb: sb, business: { id: biz.id, slug: biz.slug, name: CFG.brand } });
      });
    }).catch(function (e) { show('v-signin'); say('Couldn’t load your account: ' + (e.message || e), true); });
  }

  var usePw = true;
  $('b-toggle').addEventListener('click', function () {
    usePw = !usePw;
    $('pw-wrap').hidden = !usePw; $('b-pw').hidden = !usePw; $('b-code').hidden = usePw;
    $('b-toggle').textContent = usePw ? 'No password? Email me a code instead' : 'Use my password';
    say('');
  });
  var emailOk = function (e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); };
  $('f-email').addEventListener('submit', function (e) {
    e.preventDefault();
    if (usePw) { $('b-pw').click(); return; }
    var email = $('email').value.trim().toLowerCase();
    if (!emailOk(email)) { say('Please enter a valid email.', true); return; }
    $('b-code').disabled = true; say('Sending…');
    sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } }).then(function (r) {
      $('b-code').disabled = false;
      if (r.error) { say('Couldn’t send a code: ' + r.error.message, true); return; }
      $('f-email').hidden = true; $('f-code').hidden = false; $('code').focus();
      say('Check ' + email + ' for a code (or tap the link in the email on this phone).');
    });
  });
  $('f-code').addEventListener('submit', function (e) {
    e.preventDefault();
    var token = $('code').value.replace(/\D/g, '');
    if (token.length < 6) { say('Enter the code from the email.', true); return; }
    say('Checking…');
    sb.auth.verifyOtp({ email: $('email').value.trim().toLowerCase(), token: token, type: 'email' }).then(function (r) {
      if (r.error) say('That code didn’t work: ' + r.error.message, true); else say('');
    });
  });
  $('b-back').addEventListener('click', function () { $('f-code').hidden = true; $('f-email').hidden = false; say(''); });
  $('b-pw').addEventListener('click', function (e) {
    if (e) e.preventDefault();
    var email = $('email').value.trim().toLowerCase(), pw = $('password').value;
    if (!emailOk(email) || !pw) { say('Enter your email and password.', true); return; }
    say('Signing in…');
    sb.auth.signInWithPassword({ email: email, password: pw }).then(function (r) {
      if (r.error) say('Couldn’t sign in: ' + r.error.message, true); else say('');
    });
  });
  $('signout').addEventListener('click', function () { sb.auth.signOut().then(function () { lastUid = undefined; onSession(null); }); });
})();
</script>
</body>
</html>
