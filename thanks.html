<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanks | Saltwater Building Co</title>
<meta name="description" content="Custom homes, renovations and commercial builds in Ucluelet, Tofino and remote coastal BC.">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Saltwater Building Co | Custom Home Builder, Ucluelet &amp; Tofino">
<meta property="og:description" content="Custom homes, renovations and commercial builds in Ucluelet, Tofino and remote coastal BC.">
<meta property="og:url" content="https://www.saltwaterbuildingco.ca/">
<meta property="og:locale" content="en_CA">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,500;125,700;125,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed bands like a coastline in section; content sits on a 1160px column. Photos lead, words stay short. */
:root{
  --fog:#EEF2F1;      /* page */
  --paper:#FFFFFF;    /* raised surfaces */
  --ink:#0F2226;      /* text, deep water */
  --muted:#556A6D;    /* secondary text */
  --line:#CFD9D7;     /* rules */
  --tide:#1D5A66;     /* primary accent: Pacific teal */
  --cedar:#B0703F;    /* second accent, sparingly */
  --slot-a:#C9D4D2; --slot-b:#A9BAB8; /* photo placeholders */
  --band:#0F2226; --band-ink:#E8EEED; --band-muted:#9FB3B2;
  --note:#FFF4D6; --note-ink:#5B4300;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:4px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fog:#0C1A1D;--paper:#13262A;--ink:#E6EEED;--muted:#9AB0B0;--line:#24403F;--tide:#5FB3C1;--cedar:#D99A66;
  --slot-a:#1C3337;--slot-b:#284549;--band:#071114;--band-ink:#E6EEED;--band-muted:#8AA3A3;--note:#3A2F10;--note-ink:#F6E3A6;color-scheme:dark}}
:root[data-theme="dark"]{
  --fog:#0C1A1D;--paper:#13262A;--ink:#E6EEED;--muted:#9AB0B0;--line:#24403F;--tide:#5FB3C1;--cedar:#D99A66;
  --slot-a:#1C3337;--slot-b:#284549;--band:#071114;--band-ink:#E6EEED;--band-muted:#8AA3A3;--note:#3A2F10;--note-ink:#F6E3A6;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--fog);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:var(--tide)}
:focus-visible{outline:3px solid var(--cedar);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-stretch:125%;font-weight:800;line-height:1.02;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:clamp(30px,4.6vw,52px);text-transform:uppercase}
h3{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
p{margin:0}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tide)}
.lead{font-size:clamp(18px,2vw,21px);color:var(--muted);max-width:60ch}
.section{padding-block:clamp(64px,9vw,112px)}
.stack{display:grid;gap:18px}

.ask{display:none;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--note);color:var(--note-ink);border:1px dashed currentColor;border-radius:3px;padding:4px 6px;vertical-align:middle;white-space:nowrap}

body.draft .ask{display:inline-block}
/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--fog) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--fog)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:34px;height:34px;flex:none}
.brand span{font:800 15px/1 var(--display);font-stretch:125%;letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font:500 10px/1.4 var(--mono);letter-spacing:.16em;color:var(--muted);margin-top:3px}
.links{display:flex;gap:26px;align-items:center}
.links a{color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
.links a:hover{color:var(--tide)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r);font:700 14px/1 var(--display);font-stretch:112%;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:2px solid var(--tide);cursor:pointer;transition:background .15s,color .15s}
.btn-fill{background:var(--tide);color:var(--fog)}
.btn-fill:hover{background:var(--ink);border-color:var(--ink)}
.btn-line{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--fog)}
@media (max-width:860px){.links a:not(.btn){display:none}.links .btn{min-height:42px;padding:0 14px;font-size:12px}}

/* photo placeholders */
.slot{position:relative;overflow:hidden;border-radius:var(--r);background:
  linear-gradient(180deg,transparent 58%,color-mix(in srgb,var(--slot-b) 70%,transparent) 58% 61%,transparent 61%),
  linear-gradient(165deg,var(--slot-a),var(--slot-b));
  max-width:100%}
.slot::before{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:
  radial-gradient(120% 90% at 18% 100%,var(--slot-b) 40%,transparent 41%),
  radial-gradient(90% 80% at 62% 100%,color-mix(in srgb,var(--slot-b) 85%,var(--ink)) 38%,transparent 39%),
  radial-gradient(70% 70% at 95% 100%,var(--slot-b) 36%,transparent 37%);opacity:.8}
.slot figcaption{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:8px;align-items:center;font:500 12px/1.35 var(--mono);color:var(--ink);background:color-mix(in srgb,var(--fog) 88%,transparent);padding:7px 10px;border-radius:3px;width:max-content;max-width:calc(100% - 24px)}
.slot figcaption svg{width:14px;height:14px;flex:none}
figure{margin:0}

/* hero */
.hero{padding-block:clamp(36px,6vw,72px) clamp(48px,7vw,88px)}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(28px,5vw,64px);align-items:end}
.hero h1{font-size:clamp(44px,6.4vw,80px);text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--tide)}
.hero .slot{aspect-ratio:4/5}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.coords{font:400 12px/1.5 var(--mono);color:var(--muted);letter-spacing:.06em}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero .slot{aspect-ratio:4/3}}

.facts{border-block:1px solid var(--line)}
.facts .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.fact{padding:20px 18px 20px 0;display:grid;gap:4px;min-width:0}
.fact+.fact{padding-left:18px;border-left:1px solid var(--line)}
.fact b{font:700 15px/1.2 var(--display);font-stretch:112%;text-transform:uppercase;letter-spacing:.02em}
.fact span{font:400 13px/1.4 var(--mono);color:var(--muted)}
@media (max-width:760px){.facts .wrap{grid-template-columns:1fr 1fr}.fact:nth-child(3){padding-left:0;border-left:0}.fact:nth-child(n+3){border-top:1px solid var(--line)}}

/* featured build */
.feature{background:var(--band);color:var(--band-ink)}
.feature .eyebrow{color:var(--cedar)}
.feature .lead{color:var(--band-muted)}
.feature-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(28px,5vw,64px);align-items:start}
.feature .slot{aspect-ratio:16/10}
.feature .slot figcaption{color:#0F2226;background:rgba(238,242,241,.9)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;margin:0;font-size:15px;border-top:1px solid color-mix(in srgb,var(--band-ink) 18%,transparent);padding-top:20px}
.spec dt{font:500 12px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--band-muted)}
.spec dd{margin:0}
.status{display:inline-flex;align-items:center;gap:8px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--cedar);box-shadow:0 0 0 4px color-mix(in srgb,var(--cedar) 30%,transparent)}
.log{display:grid;gap:0;margin-top:8px}
.log div{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-top:1px solid color-mix(in srgb,var(--band-ink) 14%,transparent);font-size:15px}
.log time{font:500 12px/1.7 var(--mono);color:var(--band-muted)}
.feature .btn-line{color:var(--band-ink);border-color:var(--band-ink)}
.feature .btn-line:hover{background:var(--band-ink);color:var(--band)}
@media (max-width:860px){.feature-grid{grid-template-columns:1fr}}

/* services */
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--ink);margin-top:36px}
.svc{padding:24px 22px 8px 0;display:grid;gap:10px;align-content:start;min-width:0}
.svc+.svc{padding-left:22px;border-left:1px solid var(--line)}
.svc p{color:var(--muted);font-size:16px}
.svc svg{width:30px;height:30px;color:var(--tide)}
@media (max-width:900px){.svc-grid{grid-template-columns:1fr 1fr}.svc:nth-child(3){padding-left:0;border-left:0}.svc:nth-child(n+3){border-top:1px solid var(--line);padding-top:24px}}
@media (max-width:520px){.svc-grid{grid-template-columns:1fr}.svc,.svc+.svc{padding-left:0;border-left:0}.svc+.svc{border-top:1px solid var(--line)}}

/* projects */
.head-row{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 13px/1 var(--mono);padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--fog);border-color:var(--ink)}
.proj-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:22px;margin-top:36px}
.proj{grid-column:span 6;display:grid;gap:14px;text-decoration:none;color:inherit;min-width:0}
.proj:nth-child(1){grid-column:span 7}.proj:nth-child(2){grid-column:span 5}
.proj:nth-child(3){grid-column:span 5}.proj:nth-child(4){grid-column:span 7}
.proj .slot{aspect-ratio:4/3;transition:transform .3s}
.proj:hover .slot{transform:scale(.99)}
.proj-meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.proj-meta span{font:400 13px/1.4 var(--mono);color:var(--muted)}
@media (max-width:760px){.proj,.proj:nth-child(n){grid-column:1/-1}}

/* how we build */
.build-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(28px,5vw,72px);align-items:start}
.layers{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.layer{display:grid;grid-template-columns:14px 1fr;gap:16px;padding:18px 20px;border-top:1px solid var(--line)}
.layer:first-child{border-top:0}
.layer i{border-radius:2px}
.layer:nth-child(1) i{background:var(--cedar)}
.layer:nth-child(2) i{background:repeating-linear-gradient(90deg,var(--muted) 0 2px,transparent 2px 6px)}
.layer:nth-child(3) i{background:var(--tide)}
.layer:nth-child(4) i{background:repeating-linear-gradient(45deg,var(--slot-b) 0 3px,var(--slot-a) 3px 6px)}
.layer:nth-child(5) i{background:var(--ink)}
.layer b{display:block;font:700 15px/1.3 var(--display);font-stretch:112%;text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
.layer span{color:var(--muted);font-size:15px}
.rain{display:flex;gap:18px;align-items:center;padding:18px 20px;background:var(--fog);border-top:1px solid var(--line)}
.rain strong{font:800 34px/1 var(--display);font-stretch:125%;color:var(--tide)}
.rain span{font:400 13px/1.45 var(--mono);color:var(--muted)}
@media (max-width:860px){.build-grid{grid-template-columns:1fr}}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:40px;counter-reset:s}
.step{display:grid;gap:10px;align-content:start;padding-top:18px;border-top:2px solid var(--ink);counter-increment:s;min-width:0}
.step::before{content:counter(s,decimal-leading-zero);font:500 13px/1 var(--mono);color:var(--tide);letter-spacing:.1em}
.step p{color:var(--muted);font-size:16px}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

/* testimonial */
.quote{background:var(--paper);border-block:1px solid var(--line)}
.quote blockquote{margin:0;display:grid;gap:22px;max-width:900px}
.quote q{font:700 clamp(24px,3.4vw,38px)/1.18 var(--display);font-stretch:112%;quotes:"“" "”"}
.quote cite{font:400 14px/1.4 var(--mono);color:var(--muted);font-style:normal}

/* contact */
.contact-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(28px,5vw,72px);align-items:start}
.direct{display:grid;gap:14px;margin-top:8px}
.direct div{display:grid;gap:2px;padding:14px 0;border-top:1px solid var(--line)}
.direct dt{font:500 12px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.direct dd{margin:0;font-weight:600;font-size:18px;user-select:all}
form{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,3vw,32px);display:grid;gap:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
label{display:grid;gap:6px;font-weight:600;font-size:14px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--fog);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:48px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tide);outline-offset:0;border-color:var(--tide)}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types label{display:inline-flex;align-items:center;gap:8px;font-weight:500;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--fog);cursor:pointer;min-height:42px}
.types input{width:auto;min-height:0;accent-color:var(--tide)}
.types label:has(input:checked){border-color:var(--tide);background:color-mix(in srgb,var(--tide) 12%,var(--fog))}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:600;font-size:14px;margin-bottom:6px;padding:0}
.done{background:color-mix(in srgb,var(--tide) 12%,var(--paper));border:1px solid var(--tide);border-radius:var(--r);padding:16px;font-size:15px}
.fine{font-size:13px;color:var(--muted)}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}}

/* scroll story (from Brix): pinned crossfade through build stages */
.story-track{display:grid;gap:22px;margin-top:36px}
.story-stage{display:grid;gap:22px}
.story-frame{margin:0;display:grid;gap:10px}
.story-frame .slot{aspect-ratio:16/9}
.story-cap{font-size:16px;color:var(--muted)}
.story-cap b{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cedar);margin-right:8px}
.story-hint{display:none}
.story-track.is-live{height:calc(100svh + (var(--n,4) - 1) * 70svh);display:block}
.story-track.is-live .story-stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);grid-template-areas:"s";gap:0;height:calc(100svh - 110px);align-content:center}
.story-track.is-live .story-frame{grid-area:s;display:grid;grid-template-areas:"s";opacity:var(--o,0)}
.story-track.is-live .story-frame:first-child{opacity:1}
.story-track.is-live .story-frame .slot{grid-area:s;max-height:calc(100svh - 150px);width:100%}
.story-track.is-live .story-cap{grid-area:s;align-self:end;margin:0;padding:16px 18px;background:linear-gradient(transparent,rgba(8,18,20,.85));color:#fff;border-radius:0 0 var(--r) var(--r);opacity:var(--c,0);z-index:1}
.story-track.is-live .story-frame .slot figcaption{top:12px;bottom:auto;opacity:var(--c,0)}
.story-track.is-live .story-frame:first-child .slot figcaption{opacity:max(var(--c,0),.001)}
.story-track.is-live .story-cap{background:linear-gradient(transparent,rgba(8,18,20,.92) 45%)}
.story-track.is-live .story-hint{display:block;grid-area:s;align-self:start;justify-self:center;margin-top:56px;padding:6px 12px;border-radius:99px;background:rgba(8,18,20,.7);color:#fff;font:500 12px/1 var(--mono);letter-spacing:.08em;opacity:var(--st-hint,1);pointer-events:none;z-index:2}
.story-track.is-live .story-hint::after{content:" ↓"}
@media (prefers-reduced-motion:reduce){.story-track.is-live{height:auto}}

/* why choose (from Brix) */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:36px}
.why-grid div{display:grid;gap:8px;align-content:start;min-width:0;padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.why-grid p{color:var(--muted);font-size:16px}
@media (max-width:900px){.why-grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.why-grid{grid-template-columns:1fr}}

/* service areas (from Brix) */
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:36px;border-top:2px solid var(--ink)}
.area{display:grid;gap:8px;padding:22px 22px 6px 0;align-content:start;min-width:0}
.area+.area{padding-left:22px;border-left:1px solid var(--line)}
.area span{font:400 12px/1.4 var(--mono);color:var(--tide);letter-spacing:.06em}
.area p{color:var(--muted);font-size:16px}
@media (max-width:900px){.areas{grid-template-columns:1fr 1fr}.area:nth-child(3){padding-left:0;border-left:0}.area:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:520px){.areas{grid-template-columns:1fr}.area,.area+.area{padding-left:0;border-left:0}.area+.area{border-top:1px solid var(--line)}}

/* upload + review */
.drop{display:grid;gap:6px;padding:16px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--fog);font-weight:500;font-size:15px;cursor:pointer}
.drop input{border:0;padding:0;min-height:0;background:none;font-size:14px}
.drop small{color:var(--muted);font-weight:400;font-size:13px}
.review-btn{justify-self:start}

/* Ask Saltwater (from Ask Jess / Smith Orthotics) */
.ask-fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--cedar);color:#fff;font:700 14px/1 var(--display);font-stretch:112%;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.ask-fab svg{width:18px;height:18px}
.ask-panel{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:41;width:min(380px,calc(100vw - 36px));max-height:min(560px,calc(100svh - 140px));display:grid;grid-template-rows:auto 1fr auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.28);overflow:hidden}
.ask-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:var(--band);color:var(--band-ink)}
.ask-head b{font:800 14px/1 var(--display);font-stretch:125%;text-transform:uppercase;letter-spacing:.04em}
.ask-head small{display:block;font:400 11px/1.4 var(--mono);color:var(--band-muted);margin-top:4px}
.ask-x{background:none;border:0;color:var(--band-ink);font-size:24px;line-height:1;cursor:pointer;min-width:40px;min-height:40px}
.ask-log{overflow-y:auto;padding:14px 16px;display:grid;gap:10px;align-content:start}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:15px;line-height:1.45}
.msg.bot{background:var(--fog);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:3px}
.msg.me{background:var(--tide);color:var(--fog);justify-self:end;border-bottom-right-radius:3px}
.ask-sugs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.ask-sugs button{font:500 13px/1.2 var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--tide);background:transparent;color:var(--tide);cursor:pointer;min-height:36px;text-align:left}
@media (max-width:700px){.ask-fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));min-height:46px;padding:0 16px}.ask-panel{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}

footer{background:var(--band);color:var(--band-muted);font-size:14px}
footer .wrap{padding-block:40px calc(40px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer b{color:var(--band-ink);font:800 14px/1 var(--display);font-stretch:125%;text-transform:uppercase;letter-spacing:.04em}
footer a{color:var(--band-ink)}

/* phone call bar */
.callbar{display:none}
@media (max-width:700px){
  .callbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--fog);border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  .callbar .btn{min-height:46px}
  footer .wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
}
</style>
